version: 2.1

# Quality gate for the two folders. GitHub Actions keeps what needs a service
# (example/ e2e against Postgres), the sync guard and the secret scan.
# One job per folder = one `npm ci` per folder, then the five gates run
# sequentially in it. No workspace hand-off, no repeated installs.

orbs:
  node: circleci/node@7

jobs:
  quality:
    parameters:
      app:
        type: enum
        enum: [template, example]
    executor:
      name: node/default
      tag: '24'
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: << parameters.app >>
      - run:
          name: Prettier
          command: cd << parameters.app >> && npm run format:check
      - run:
          name: ESLint
          command: cd << parameters.app >> && npm run lint:check
      - run:
          name: TypeScript
          command: cd << parameters.app >> && npm run typecheck
      - run:
          name: Unit tests with coverage
          command: cd << parameters.app >> && npm run test:cov
      - store_artifacts:
          path: << parameters.app >>/coverage
          destination: coverage-<< parameters.app >>
      - run:
          name: Build
          command: cd << parameters.app >> && npm run build

  e2e-template:
    executor:
      name: node/default
      tag: '24'
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: template
      # Same reason as in .github/workflows/ci.yml: env/ is git-ignored.
      - run:
          name: Prepare env
          command: |
            mkdir -p template/env
            sed -e 's|^JWT_SECRET=.*|JWT_SECRET=ci-only-secret-value-at-least-32-characters|' \
              template/.env.example > template/env/.env.development
      - run:
          name: End-to-end tests (database-free)
          command: cd template && npm run test:e2e

  license:
    executor:
      name: node/default
      tag: '24'
    steps:
      - checkout
      - run:
          name: Require FOSSA_API_KEY
          command: |
            : "${FOSSA_API_KEY:?FOSSA_API_KEY is not set. CircleCI > Project Settings > Environment Variables}"
      - run:
          name: Install FOSSA CLI
          command: |
            curl -sSfL -H 'Cache-Control: no-cache' \
              https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash -s -- -b /usr/local/bin
            fossa --version
      - run:
          name: FOSSA analyze
          # --without-default-filters is mandatory: FOSSA skips any directory
          # named `example/` by default, which is half of this repository.
          # paths.only/exclude in .fossa.yml keep the surface tight instead.
          command: fossa analyze --without-default-filters
      - run:
          name: FOSSA license gate
          command: fossa test

workflows:
  quality-gate:
    jobs:
      - quality:
          matrix:
            parameters:
              app: [template, example]
      - e2e-template
      - license
