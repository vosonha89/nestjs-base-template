version: 2.1

# Pipeline: install -> lint/format/typecheck (parallel) -> test -> build.
# No secrets are required: the suite runs against mocked repositories.

orbs:
  node: circleci/node@7

jobs:
  install:
    executor:
      name: node/default
      tag: '22'
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  quality:
    executor:
      name: node/default
      tag: '22'
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: ESLint
          command: npm run lint:check
      - run:
          name: Prettier
          command: npm run format:check
      - run:
          name: TypeScript
          command: npm run typecheck

  test:
    executor:
      name: node/default
      tag: '22'
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Unit tests with coverage
          command: npm run test:cov
      - store_artifacts:
          path: coverage
          destination: coverage

  build:
    executor:
      name: node/default
      tag: '22'
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build
          command: npm run build
      - store_artifacts:
          path: dist

workflows:
  ci:
    jobs:
      - install
      - quality:
          requires: [install]
      - test:
          requires: [install]
      - build:
          requires: [quality, test]
