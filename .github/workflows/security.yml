name: Security

# Dependency and container gates — the checks that can block a pull request.
# SAST lives in codeql.yml, the supply-chain posture score in scorecard.yml.
# Every job here is action-only: no `run:` step means no shell surface for
# attacker-controlled event payloads to reach.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 12 * * 1'

permissions:
  contents: read

jobs:
  # Compares the PR against its base and fails only on vulnerabilities the PR
  # introduces, so a pre-existing advisory cannot block unrelated work.
  osv-pr:
    name: OSV-Scanner (new vulnerabilities)
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    permissions:
      actions: read
      contents: read
      security-events: write

  # Full scan of both lockfiles. Reports everything to Security > Code scanning.
  osv-scheduled:
    name: OSV-Scanner (full)
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # Named explicitly, like .fossa.yml: the repository root has no lockfile,
      # the two real dependency graphs live one level down.
      scan-args: |-
        --lockfile=package-lock.json:template/package-lock.json
        --lockfile=package-lock.json:example/package-lock.json
      # Report, do not block. Both lockfiles are currently clean (npm audit and
      # OSV report zero advisories); failing here would leave the gate
      # permanently red the day a new advisory lands. Findings still reach
      # Security > Code scanning, and the PR job above blocks a new regression.
      fail-on-vuln: false

  # Complements Dependabot: Dependabot opens the fix, this blocks the regression.
  # Requires Settings > Code security > Dependency graph to be enabled, or the
  # action's diff call returns 403 and this check is red with nothing to blame.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # template/ owns the Dockerfile; example/ is a byte-identical copy, so
      # linting it again would only duplicate every finding.
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: template/Dockerfile
          # `USER node` is deliberate — the unprivileged user shipped with the
          # base image. Hadolint reports that as DL3066 (info), and its default
          # threshold fails on info, so the gate would be red on arrival.
          # Warnings and errors still block; advisories stay visible in the log.
          failure-threshold: warning
