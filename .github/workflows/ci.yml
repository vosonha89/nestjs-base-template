name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs the five gates in both folders. `example/` usually catches the
  # regression first because it exercises the template through a real app.
  # Node 24 is the floor: `@nestjs/*` is ESM-only and Jest can only
  # `require(esm)` it from Node 24.9 onwards.
  quality:
    name: quality (${{ matrix.app }}, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [template, example]
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Format
        working-directory: ${{ matrix.app }}
        run: npm run format:check

      - name: Lint
        working-directory: ${{ matrix.app }}
        run: npm run lint:check

      - name: Typecheck
        working-directory: ${{ matrix.app }}
        run: npm run typecheck

      - name: Unit tests with coverage
        working-directory: ${{ matrix.app }}
        run: npm run test:cov

      # env/.env.* is git-ignored, so the boot-time env validation
      # (src/config/env.validation.ts) has nothing to read in CI.
      - name: Prepare env (template e2e boots the real config module)
        if: matrix.app == 'template'
        working-directory: template
        run: |
          mkdir -p env
          sed -e 's|^JWT_SECRET=.*|JWT_SECRET=ci-only-secret-value-at-least-32-characters|' \
            .env.example > env/.env.development

      # The template's e2e suite is deliberately database-free, so it runs
      # here. The example's suite needs Postgres and lives in e2e.yml.
      - name: End-to-end tests (template only, no database)
        if: matrix.app == 'template'
        working-directory: ${{ matrix.app }}
        run: npm run test:e2e

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

      - name: Store coverage
        if: matrix.node == '26'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.app }}
          path: ${{ matrix.app }}/coverage
          retention-days: 7

  # Proves `template/` stands on its own: a workspace would hoist a dependency
  # that the template's package.json forgot to declare, and the consumer would
  # only find out after `npx degit`. No workspace here, and that is the point.
  standalone-template:
    name: template installs and builds alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: template/package-lock.json

      - name: Guard against the repository root leaking into the build
        run: test ! -d node_modules

      - name: Install
        working-directory: template
        run: npm ci

      - name: Build
        working-directory: template
        run: npm run build

  # Simulates the consumer path end to end: copy the template out, rename it,
  # and require that the result still passes every gate.
  consumer-flow:
    name: init-app.sh produces a working app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: template/package-lock.json

      - name: Install in the template
        working-directory: template
        run: npm ci

      - name: The scaffolder must be executable
        run: |
          test -x template/scripts/init-app.sh || {
            echo "::error::template/scripts/init-app.sh is not executable. Fix: git update-index --chmod=+x template/scripts/init-app.sh"
            exit 1
          }

      - name: Copy out and rename
        run: |
          mkdir -p "$RUNNER_TEMP/my-api"
          tar -cf - --exclude=node_modules --exclude=dist --exclude=coverage --exclude=env \
            -C template . | tar -xf - -C "$RUNNER_TEMP/my-api"
          cd "$RUNNER_TEMP/my-api"
          ./scripts/init-app.sh --name my-api --port 3010 --db my_api

      - name: The renamed app must still be green
        working-directory: ${{ runner.temp }}/my-api
        run: |
          cp -a "$GITHUB_WORKSPACE/template/node_modules" node_modules
          npm run format:check
          npm run lint:check
          npm run typecheck
          npm run test:e2e
          npm run build

      - name: The scaffolding must be gone
        working-directory: ${{ runner.temp }}/my-api
        run: test ! -d scripts