name: Scorecard

# Supply-chain posture score, published so the badge works. This lives in its
# own workflow because the Scorecard API enforces strict rules on the producing
# workflow: no top-level env/defaults, no workflow-level write permissions, and
# only the approved actions inside the analysis job. Mixing it with the other
# security jobs would risk the publication being rejected.
on:
  branch_protection_rule:
  schedule:
    - cron: '18 4 * * 2'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the SARIF result to Security > Code scanning.
      security-events: write
      # Needed to publish the result: the OIDC token proves it came from here.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Held at v2.5.0 on purpose: v2.6.0's published image index resolves, but
      # both of its child manifests return 404 (MANIFEST_UNKNOWN), so the runner's
      # docker pull fails before any step runs and re-running cannot help.
      # Re-evaluate once upstream republishes the image.
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
