name: CodeQL

# SAST for the TypeScript source. Free and unlimited on public repositories;
# findings land in Security > Code scanning. The JavaScript/TypeScript
# extractor reads source directly, so no build step is needed — hence
# `build-mode: none`. Both folders are scanned: `example/` holds the auth and
# SQL code most likely to carry a real vulnerability.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '24 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          # Beyond the default suite: injection, path traversal, XSS and the
          # rest of the security-focused queries.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
