name: License

# FOSSA license compliance — the one gate that needs an external account. It
# needs a FOSSA_API_KEY repository secret, and the scan surface is pinned by
# .fossa.yml because the lockfiles live in template/ and example/, not at the
# repository root.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '42 5 * * 1'

permissions:
  contents: read

jobs:
  fossa:
    name: FOSSA license gate
    # A pull request from a fork cannot read repository secrets, so the gate
    # only runs where the key is actually available. Same-repo PRs still run it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fail with a readable instruction rather than a 401 from the FOSSA API.
      - name: Require FOSSA_API_KEY
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          : "${FOSSA_API_KEY:?FOSSA_API_KEY is not set. Add it under Settings > Secrets and variables > Actions}"

      - name: Install FOSSA CLI
        run: |
          curl -sSfL -H 'Cache-Control: no-cache' \
            https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash -s -- -b /usr/local/bin
          fossa --version

      - name: FOSSA analyze
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        # --without-default-filters is mandatory: FOSSA skips any directory named
        # `example/` by default, which is half of this repository. The
        # paths.only/exclude rules in .fossa.yml keep the surface tight instead.
        run: fossa analyze --without-default-filters

      - name: FOSSA license gate
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: fossa test
