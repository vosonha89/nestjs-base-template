name: License

# FOSSA license compliance — the one gate that needs an external account. It
# needs a FOSSA_API_KEY repository secret, and the scan surface is pinned by
# .fossa.yml because the lockfiles live in template/ and example/, not at the
# repository root.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '42 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A superseded PR push has nothing left to prove. Never cancel a main or
# scheduled run: those are the history of record for the default branch.
concurrency:
  group: license-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fossa:
    name: FOSSA license gate
    # A pull request from a fork cannot read repository secrets, so the gate
    # only runs where the key is actually available. Same-repo PRs still run it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `secrets` cannot be read from a job-level `if`, so the key is probed
      # here, before checkout: a missing key must cost seconds, not a clone.
      # Missing key => the scan is skipped with a warning, never failed. A
      # consumer of this template has no FOSSA account, and the FOSSA GitHub
      # App still reports the license posture on the commit itself.
      - name: Detect FOSSA_API_KEY
        id: key
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          if [ -n "${FOSSA_API_KEY//[[:space:]]/}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "FOSSA_API_KEY is set — running the license gate."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=FOSSA license gate skipped::FOSSA_API_KEY is not set, so the license scan is skipped. Add it under Settings > Secrets and variables > Actions."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'

      # Pinned release + published checksum: the old `curl install-latest.sh |
      # bash` was a moving target (Scorecard downloadThenRun finding). Bump the
      # version manually; Dependabot cannot track this URL.
      - name: Install FOSSA CLI (pinned v3.20.13)
        if: steps.key.outputs.present == 'true'
        run: |
          base=https://github.com/fossas/fossa-cli/releases/download/v3.20.13
          curl -sSfL -o fossa.tar.gz "$base/fossa_3.20.13_linux_amd64.tar.gz"
          curl -sSfL -o fossa.tar.gz.sha256 "$base/fossa_3.20.13_linux_amd64.tar.gz.sha256"
          echo "$(awk '{print $1}' fossa.tar.gz.sha256)  fossa.tar.gz" | sha256sum -c -
          tar -xzf fossa.tar.gz
          sudo install -m 0755 fossa /usr/local/bin/fossa
          fossa --version

      - name: FOSSA analyze
        if: steps.key.outputs.present == 'true'
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        # --without-default-filters is mandatory: FOSSA skips any directory named
        # `example/` by default, which is half of this repository. The
        # paths.only/exclude rules in .fossa.yml keep the surface tight instead.
        run: |
          export FOSSA_API_KEY="${FOSSA_API_KEY//[[:space:]]/}"
          fossa analyze --without-default-filters

      - name: FOSSA license gate
        if: steps.key.outputs.present == 'true'
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        # `fossa test` checks security + quality + license issues, but this
        # gate owns license compliance only. Security issues are tracked via
        # the FOSSA badge and the security.yml workflow; quality issues are
        # left to Dependabot. Query the API directly for licensing issues only.
        run: |
          export FOSSA_API_KEY="${FOSSA_API_KEY//[[:space:]]/}"
          LOCATOR="git%2Bgithub.com%2Fvosonha89%2Fnestjs-base-template"
          RESPONSE=$(curl -sS -g -H "Authorization: token ${FOSSA_API_KEY}" \
            "https://app.fossa.com/api/v2/issues?category=licensing&status=active&scope[type]=project&scope[id]=${LOCATOR}")
          COUNT=$(echo "$RESPONSE" | jq '.issues | length')
          if [ "${COUNT:-0}" -gt 0 ] 2>/dev/null; then
            echo "::error title=FOSSA license issues found::${COUNT} active licensing issue(s). Check https://app.fossa.com/projects/git%2Bgithub.com%2Fvosonha89%2Fnestjs-base-template"
            echo "$RESPONSE" | jq '.issues'
            exit 1
          fi
          echo "FOSSA license gate passed — no active licensing issues."
