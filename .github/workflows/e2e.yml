name: Example e2e

# The example's suite asserts the parts that only a real database can prove:
# migrations, the seed, `SELECT … FOR UPDATE`, and the unique-index -> 409 path.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: migrations, seed and e2e against Postgres 17
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nestjs_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nestjs_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: example/package-lock.json

      - name: Install
        working-directory: example
        run: npm ci

      # The env file is git-ignored, so CI builds it from the committed example.
      - name: Prepare env
        working-directory: example
        run: |
          mkdir -p env
          sed -e 's|^JWT_SECRET=.*|JWT_SECRET=ci-only-secret-value-at-least-32-characters|' \
            .env.example > env/.env.development

      - name: Run migrations
        working-directory: example
        run: npm run migration:run

      - name: Seed
        working-directory: example
        run: npm run seed

      - name: End-to-end tests
        working-directory: example
        run: npm run test:e2e