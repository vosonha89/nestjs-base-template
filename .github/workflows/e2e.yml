name: Example e2e

# The example's suite asserts the parts that only a real database can prove:
# migrations, the seed, `SELECT … FOR UPDATE`, and the unique-index -> 409 path.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: migrations, seed and e2e against Postgres 17
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nestjs_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nestjs_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      NODE_ENV: development

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: example/package-lock.json

      - name: Install
        working-directory: example
        run: npm ci

      # The env file is git-ignored, so CI builds it from the committed example.
      - name: Prepare env
        working-directory: example
        run: |
          mkdir -p env
          sed -e 's|^JWT_SECRET=.*|JWT_SECRET=ci-only-secret-value-at-least-32-characters|' \
            .env.example > env/.env.development

      - name: Run migrations
        working-directory: example
        run: npm run migration:run

      - name: Seed
        working-directory: example
        run: npm run seed

      - name: Wait for Postgres readiness
        working-directory: example
        run: |
          for i in {1..15}; do
            if pg_isready -h localhost -p 5432 -U postgres -d nestjs_api 2>/dev/null; then
              echo "Postgres is ready for connections"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/15)"
            sleep 2
          done
          echo "::error::Postgres not ready after 30 seconds"
          exit 1

      - name: Additional wait for Postgres stabilization
        run: sleep 10

      - name: End-to-end tests
        working-directory: example
        run: npm run test:e2e