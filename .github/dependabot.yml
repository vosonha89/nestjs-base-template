version: 2
updates:
  - package-ecosystem: npm
    directory: /template
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Verified: TypeScript 7.0 ships only the `tsc` executable and no
      # programmatic compiler API, so `nest build` and `typescript-eslint` both
      # fail. Re-evaluate at 7.1, which restores the API.
      - dependency-name: typescript
        versions: ['>=7.0.0']
      # `@types/node` must match the runtime major, not run ahead of it.
      - dependency-name: '@types/node'
        versions: ['>=27.0.0']

  - package-ecosystem: npm
    directory: /example
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        versions: ['>=7.0.0']
      - dependency-name: '@types/node'
        versions: ['>=27.0.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # v2.6.0's container image is broken upstream: the index resolves but both
      # child manifests 404, so the Scorecard job cannot pull it. Only this exact
      # version is held back — later releases are still proposed. Drop this bound
      # once upstream republishes the image.
      - dependency-name: ossf/scorecard-action
        versions: ['2.6.0']

  # Docker base-image digest bumps. template/ only: example/Dockerfile is a
  # byte-identical synced copy, so a second ecosystem would open divergent PRs
  # that fail sync-guard. Merge flow for these PRs: check out the Dependabot
  # branch, run `npm run sync` from the repo root, push the sync commit to the
  # same branch, then merge.
  - package-ecosystem: docker
    directory: /template
    schedule:
      interval: weekly