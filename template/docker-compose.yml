# Local Postgres for a fresh clone (no cloud credentials required).
# The template's default env/.env.development points at a remote instance;
# switch DB_HOST to `localhost` to use this stack instead.
#
#   docker compose up -d
#   docker compose logs -f postgres
#
# Adminer UI: http://localhost:8080
#   System: PostgreSQL — Server: postgres — User/Pass/DB from below

services:
  postgres:
    image: postgres:17-alpine
    container_name: nestjs-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nestjs_api
      # Deterministic locale so migrations behave identically everywhere.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nestjs_api']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer:latest
    container_name: nestjs-api-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula

volumes:
  postgres-data:
    driver: local
